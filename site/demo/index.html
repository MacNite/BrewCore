<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-key="meta.title">BrewCore demo</title>
  <meta name="description" content="Interactive static demo of BrewCore: start a guided coffee brew, rate it and brew it again — sample data, runs in your browser.">
  <meta name="theme-color" content="#0b6e6a">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-icon.png">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    .demo-note { background: var(--info-bg); color: var(--info-text); font-size: 14px; }
    .demo-note .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-top: 8px; padding-bottom: 8px; }
    .demo-note button { background: none; border: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px 0; min-height: 32px; }
    .app { max-width: 640px; margin: 0 auto; padding: 20px 16px 32px; }
    .app h1 { font-size: 28px; }
    .app h2 { font-size: 20px; margin-top: 8px; }
    .stack { display: grid; gap: 12px; }
    .row { display: flex; gap: 12px; align-items: center; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .card { padding: 16px; }
    .card.link { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
    .card.link:hover { border-color: var(--accent); }
    label.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    select, input[type=number], input[type=text], textarea {
      width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-weight: 400;
    }
    textarea { min-height: 96px; resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); }
    .pill.accent { background: var(--accent-soft); color: var(--accent-soft-text); }
    .pill.warm { background: var(--warm-soft); color: var(--warm); }
    .stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stars { color: var(--warm); letter-spacing: 1px; white-space: nowrap; }
    .fav { background: none; border: 0; font-size: 22px; min-width: var(--tap); min-height: var(--tap); cursor: pointer; color: var(--text-muted); }
    .fav[aria-pressed=true] { color: var(--warm); }
    .empty { text-align: center; padding: 32px 16px; color: var(--text-muted); }
    .steplist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .steplist li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); }
    .steplist .n { font-weight: 700; color: var(--accent); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    .kv dt { color: var(--text-muted); }
    .kv dd { margin: 0; font-weight: 600; }
    .back { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 8px 0; min-height: 40px; }

    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
    .tabs button { background: none; border: 0; color: var(--text-muted); font: inherit; font-size: 12px; font-weight: 600; min-height: 64px; display: grid; place-items: center; gap: 2px; cursor: pointer; }
    .tabs button svg { width: 24px; height: 24px; }
    .tabs button[aria-current=page] { color: var(--accent); }

    /* Live brew */
    .live { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
    .live[hidden], .toast[hidden] { display: none; }
    .live .inner { max-width: 560px; width: 100%; margin: 0 auto; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .live .timer { font-size: clamp(72px, 22vw, 120px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.03em; text-align: center; line-height: 1; margin-top: 12px; }
    .live .timer.paused { color: var(--text-muted); }
    .live .instr { font-size: clamp(22px, 6vw, 30px); font-weight: 700; text-align: center; }
    .live .target { font-size: 18px; text-align: center; color: var(--text-muted); }
    .live .target b { color: var(--text); font-size: 28px; }
    .live .bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .live .bar b { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .2s linear; }
    .live .next { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; color: var(--text-muted); }
    .live .actions { margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    .live .actions .btn { min-height: 60px; font-size: 18px; }
    .live .due { text-align: center; font-weight: 700; color: var(--success); background: var(--success-bg); border-radius: var(--radius-sm); padding: 8px; }
    .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }
    .dots span.done { background: var(--accent); }
    .dots span.cur { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .rate { display: flex; gap: 4px; }
    .rate button { font-size: 34px; background: none; border: 0; cursor: pointer; color: var(--line-strong); min-width: var(--tap); min-height: var(--tap); padding: 0; }
    .rate button.on { color: var(--warm); }
    .seg { display: grid; grid-template-columns: 1fr repeat(5, 40px); gap: 4px; align-items: center; }
    .seg span { font-size: 14px; font-weight: 600; }
    .seg button { height: 40px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
    .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
    @media (max-width: 380px) { .seg { grid-template-columns: 1fr repeat(5, 34px); } .two { grid-template-columns: 1fr; } }
  </style>

        { k: "step.serve" }] },
      { id: "aeropress-standard", name: "r.aero", brewer: "AeroPress", dose: 15, water: 230, temp: 90, grind: "MEDIUM", time: 150, steps: [
        prep("step.prepareAp"), { k: "step.addCoffee", coffee: true, conf: true }, prep("step.tare"),
        { k: "step.pour", g: 230, dur: 15, auto: true },
        { k: "step.stir", dur: 10, auto: true },
        { k: "step.steepAp", at: 105, auto: true },
        { k: "step.press", at: 135, max: 150 },
        { k: "step.serveSimple" }] },
      { id: "french-press", name: "r.fp", brewer: "French Press", dose: 30, water: 500, temp: 95, grind: "COARSE", time: 300, steps: [
        prep("step.prepareFp"), { k: "step.addCoffee", coffee: true, conf: true }, prep("step.tare"),
        { k: "step.pour", g: 500, dur: 20, auto: true },
        { k: "step.steep", at: 240, auto: true },
        { k: "step.crust", dur: 30 },
        { k: "step.pressFp", dur: 20 },
        { k: "step.serveFp" }] }
    ];
    var GRINDERS = [
      { id: "c40", name: "Comandante C40 MK4", unit: "clicks", rec: "22–28 clicks", def: 24 },
      { id: "porlex", name: "Porlex Mini II", unit: "clicks", rec: "9–11 clicks", def: 10 },
      { id: "ode", name: "Fellow Ode Gen 2", unit: "", rec: "5", def: 5 }
    ];

    function seed() {
      var day = 86400000, now = Date.now();
      function iso(daysAgo) { return new Date(now - daysAgo * day).toISOString().slice(0, 10); }
      var seeded = {
        tab: "home", view: null,
        coffees: [
          { id: "ethiopia", name: "Ethiopia Guji Hambela", roaster: "Hill Street Roasters", origin: "Ethiopia", process: "c.ethiopia.process", roasted: iso(9), fav: true },
          { id: "kenya", name: "Kenya Kiambu AA", roaster: "Hill Street Roasters", origin: "Kenya", process: "c.kenya.process", roasted: iso(14), fav: false },
          { id: "colombia", name: "Colombia Huila Pink Bourbon", roaster: "Little Owl Coffee", origin: "Colombia", process: "c.colombia.process", roasted: iso(6), fav: false },
          { id: "brazil", name: "Brazil Cerrado", roaster: "Little Owl Coffee", origin: "Brazil", process: "c.brazil.process", roasted: iso(20), fav: false }
        ],
        favRecipes: { "v60-two-pour": true },
        draft: { coffee: "ethiopia", recipe: "v60-two-pour", grinder: "c40", setting: 24, dose: 20 }
      };
      function sampleBrew(ts, coffee, recipe, grinder, setting, dose, seconds, taste) {
        var r = recipeById(recipe), c = seeded.coffees.filter(function (x) { return x.id === coffee; })[0];
        return {
          id: "b" + ts, at: ts, coffeeId: coffee, recipeId: recipe, grinderId: grinder, setting: setting, dose: dose,
          snap: snapshot(c, r, grinder, setting, dose), seconds: seconds,
          stepTimes: timedTemplate(r, seconds),
          tasting: { rating: taste.rating, again: taste.again, tags: taste.tags, attrs: taste.a, notes: taste.notes }
        };
      }
      seeded.brews = [
          sampleBrew(now - 1 * day, "ethiopia", "v60-two-pour", "c40", 24, 20, 190, { rating: 4, again: true, tags: ["JUICY", "CLEAN"], a: { acidity: 4, sweetness: 4, clarity: 5 }, notes: "Bright, peach and black tea. A touch finer next time?" }),
          sampleBrew(now - 3 * day, "ethiopia", "v60-two-pour", "c40", 26, 20, 172, { rating: 3, again: false, tags: ["SOUR", "WEAK"], a: { acidity: 5, body: 2 }, notes: "Under-extracted — went two clicks finer the next day." }),
          sampleBrew(now - 5 * day, "brazil", "french-press", "c40", 32, 30, 305, { rating: 4, again: true, tags: ["SWEET", "BALANCED"], a: { sweetness: 4, body: 5, bitterness: 2 }, notes: "Chocolate and nuts. Great with milk." })
      ];
      return seeded;
    }
    function timedTemplate(r, total) {
      var out = [], prev = 0;
      r.steps.forEach(function (s, i) {
        if (s.conf && !s.g && !s.dur && !s.at) return;
        var end = s.dur ? prev + s.dur : (s.at || s.max || total);
        if (i === r.steps.length - 1) end = total;
        out.push({ k: s.k, g: s.g ? Math.round(s.g) : null, start: prev, end: Math.min(end, total) });
        prev = Math.min(end, total);
      });
      return out;
    }

    // ---- Persistence (per-browser convenience only) --------------------------
    var state;
    try { state = JSON.parse(window.localStorage.getItem(KEY)); } catch (e) { state = null; }
    if (!state || !state.coffees) state = seed();
    function save() { try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

    // ---- Helpers -------------------------------------------------------------
    function recipeById(id) { return RECIPES.filter(function (r) { return r.id === id; })[0]; }
    function coffeeById(id) { return state.coffees.filter(function (c) { return c.id === id; })[0]; }
    function grinderById(id) { return GRINDERS.filter(function (g) { return g.id === id; })[0]; }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
    function stars(n) { return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n); }
    function round1(n) { return Math.round(n * 10) / 10; }
    function fmtG(n) { return (Math.round(n * 10) / 10).toLocaleString(S.lang); }
    function date(ts) { return new Date(ts).toLocaleDateString(S.lang === "de" ? "de-DE" : "en-GB", { weekday: "short", day: "numeric", month: "short" }); }
    function time(ts) { return new Date(ts).toLocaleTimeString(S.lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" }); }
    function roastDate(d) { return new Date(d + "T12:00:00").toLocaleDateString(S.lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "short" }); }
    // Deterministic dose scaling: every cumulative water target scales by dose / recipe dose.
    function scaled(r, dose) {
      var f = dose / r.dose;
      return r.steps.map(function (s) {
        var c = {}; for (var k in s) c[k] = s[k];
        if (s.g) c.g = round1(s.g * f);
        return c;
      });
    }
    function stepText(s, dose) { return t(s.k, { g: fmtG(s.coffee ? dose : s.g) }); }
    function snapshot(c, r, grinderId, setting, dose) {
      c = c || {};
      var g = grinderById(grinderId) || {};
      return { coffee: c.name, roaster: c.roaster, recipe: r.name, brewer: r.brewer, grinder: g.name, setting: setting + (g.unit ? " " + g.unit : ""),
        dose: dose, water: round1(r.water * dose / r.dose), temp: r.temp, grind: r.grind };
    }
    var toastTimer;
    function toast(msg) {
      var el = document.querySelector(".toast");
      if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
      el.textContent = msg; el.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2400);
    }

    // ---- Views ---------------------------------------------------------------
    var app = document.getElementById("app");

    function render() {
      document.querySelectorAll(".tabs button").forEach(function (b) {
        if (b.getAttribute("data-tab") === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      var v = state.view;
      if (v && v.type === "recipe") return renderRecipe(v.id);
      if (v && v.type === "brew") return renderBrew(v.id);
      if (v && v.type === "taste") return renderTaste(v.id);
      ({ home: renderHome, coffees: renderCoffees, recipes: renderRecipes, history: renderHistory })[state.tab]();
    }

    function options(list, sel, label) {
      return list.map(function (x) { return '<option value="' + x.id + '"' + (x.id === sel ? " selected" : "") + ">" + esc(label(x)) + "</option>"; }).join("");
    }

      app.innerHTML =
        '<h1 data-x>' + esc(t("home.hello")) + '</h1><p class="muted">' + esc(t("home.lead")) + '</p>' +
        '<div class="card stack"><h2>' + esc(t("home.start")) + '</h2>' +
          '<label class="field">' + esc(t("field.coffee")) + '<select id="f-coffee">' + options(coffees, d.coffee, function (c) { return (c.fav ? "★ " : "") + c.name + " · " + c.roaster; }) + '</select></label>' +

          '<button class="btn" style="margin-top:12px;width:100%" type="button" data-again="' + last.id + '">↻ ' + esc(t("home.again")) + '</button>' : "") +
        '<h2 style="margin-top:24px">' + esc(t("home.stats")) + '</h2>' +

        var n = Number(e.target.value); if (!(n >= 5 && n <= 60)) n = r.dose; upd("dose", round1(n)); render();
      };

    }

    function brewCard(b) {
      var ta = b.tasting;
      return '<button type="button" class="card link" data-brew="' + b.id + '">' +

    function bindBrewLinks() {

    function renderRecipe(id) {

    function renderTaste(id) {

        '<div class="card stack"><div><div class="field" style="margin-bottom:4px">' + esc(t("taste.rating")) + '</div><div class="rate" role="radiogroup" aria-label="' + esc(t("taste.rating")) + '">' +
          [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" role="radio" aria-checked="' + (f.rating === n) + '" aria-label="' + n + ' / 5" data-rate="' + n + '" class="' + (n <= f.rating ? "on" : "") + '">★</button>'; }).join("") + '</div></div>' +
          '<div><div class="field" style="margin-bottom:8px">' + esc(t("taste.again")) + '</div><div class="chips"><button type="button" class="chip" data-again-v="yes" aria-pressed="' + (f.again === true) + '">' + esc(t("taste.yes")) + '</button><button type="button" class="chip" data-again-v="no" aria-pressed="' + (f.again === false) + '">' + esc(t("taste.no")) + '</button></div></div>' +
          '<div><div class="field" style="margin-bottom:8px">' + esc(t("taste.tags")) + '</div><div class="chips">' + TAGS.map(function (x) { return '<button type="button" class="chip" data-tag="' + x + '" aria-pressed="' + (f.tags.indexOf(x) >= 0) + '">' + esc(t("tag." + x)) + '</button>'; }).join("") + '</div></div>' +
          '<div class="stack" style="gap:6px"><div class="field">' + esc(t("taste.attrs")) + '</div>' + ATTRS.map(function (a) {
            return '<div class="seg" role="group" aria-label="' + esc(t("attr." + a)) + '"><span>' + esc(t("attr." + a)) + '</span>' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-attr="' + a + '" data-n="' + n + '" aria-pressed="' + (f.attrs[a] === n) + '">' + n + '</button>'; }).join("") + '</div>';
          }).join("") + '</div>' +
          '<label class="field">' + esc(t("taste.notes")) + '<textarea id="notes" maxlength="4000">' + esc(f.notes) + '</textarea></label>' +
        '</div>' +
        '<div class="two" style="margin-top:16px"><button class="btn" type="button" id="skip">' + esc(t("taste.skip")) + '</button><button class="btn btn-primary" type="button" id="savet">' + esc(t("taste.save")) + '</button></div>';

      app.querySelectorAll("[data-rate]").forEach(function (el) { el.onclick = function () { f.rating = Number(el.getAttribute("data-rate")); save(); render(); }; });
      app.querySelectorAll("[data-again-v]").forEach(function (el) { el.onclick = function () { var v = el.getAttribute("data-again-v") === "yes"; f.again = f.again === v ? null : v; save(); render(); }; });
      app.querySelectorAll("[data-tag]").forEach(function (el) { el.onclick = function () { var x = el.getAttribute("data-tag"), i = f.tags.indexOf(x); if (i >= 0) f.tags.splice(i, 1); else f.tags.push(x); save(); render(); }; });
      app.querySelectorAll("[data-attr]").forEach(function (el) { el.onclick = function () { var a = el.getAttribute("data-attr"), n = Number(el.getAttribute("data-n")); if (f.attrs[a] === n) delete f.attrs[a]; else f.attrs[a] = n; save(); render(); }; });
      document.getElementById("notes").oninput = function (e) { f.notes = e.target.value; save(); };
      document.getElementById("skip").onclick = function () { state.tasteDraft = null; state.view = { type: "brew", id: id }; save(); render(); };
      document.getElementById("savet").onclick = function () {
        if (!f.rating) { toast(t("taste.need")); return; }
        b.tasting = { rating: f.rating, again: f.again, tags: f.tags.slice(), attrs: f.attrs, notes: f.notes.trim() || null };
        state.tasteDraft = null; state.view = { type: "brew", id: id }; save(); render(); toast(t("saved")); window.scrollTo(0, 0);
      };
    }

    // ---- Live brew: timestamp-derived state machine ---------------------------
    // Like src/lib/brewing/state-machine.ts: the brew clock is
    // now - brewStartedAt - totalPausedMs, never an incremented counter.
    var liveEl = document.getElementById("live"), tick = null, lastRenderKey = "";

    function isPrep(s) { return s.conf && !s.g && !s.dur && !s.at; }
    function clockMs(L, now) {
      if (!L.startedAt) return 0;
      var end = L.pausedAt || now;
      return end - L.startedAt - L.pausedMs;
    }
    function dueAtMs(L, i) {
      var s = L.steps[i];
      if (s.dur) return L.stepStartMs + s.dur * 1000;
      if (s.at) return s.at * 1000;
      return null;
    }
    function startLive(d) {
      var r = recipeById(d.recipe);
      state.live = { recipeId: r.id, coffeeId: d.coffee, grinderId: d.grinder, setting: d.setting, dose: d.dose,
        steps: scaled(r, d.dose), i: 0, startedAt: null, pausedAt: null, pausedMs: 0, stepStartMs: 0, records: [], status: "READY" };
      save(); openLive();
    }
    function openLive() {
      liveEl.hidden = false; document.body.style.overflow = "hidden";
      lastRenderKey = ""; advance(Date.now()); renderLive();
      clearInterval(tick); tick = setInterval(function () { advance(Date.now()); renderLive(); }, 200);
      var first = liveEl.querySelector(".btn-primary"); if (first) first.focus();
    }
    function closeLive() {
      clearInterval(tick); tick = null; liveEl.hidden = true; liveEl.innerHTML = ""; document.body.style.overflow = "";
    }
    function beginStep(L, i, atMs) {
      L.records.push({ k: L.steps[L.i].k, g: L.steps[L.i].g || null, start: L.stepStartMs, end: atMs, timed: L.startedAt != null });
      L.i = i; L.stepStartMs = atMs; L.status = "RUNNING";
      cue();
    }
    // Auto-advance lands on the exact due moment even if the tick is late.
    function advance(now) {
      var L = state.live; if (!L || L.status !== "RUNNING") return;
      var guard = 0;
      while (guard++ < 20) {
        var due = dueAtMs(L, L.i); if (due == null) return;
        if (clockMs(L, now) < due) return;
        var s = L.steps[L.i], last = L.i === L.steps.length - 1;
        if (s.auto && !s.conf && !last) { beginStep(L, L.i + 1, due); save(); }
        else { L.status = "STEP_COMPLETE"; save(); cue(); return; }
      }
    }
    function next() {
      var L = state.live, now = Date.now(), last = L.i === L.steps.length - 1;
      if (L.status === "PAUSED") return;
      if (last) return finish();
      if (!L.startedAt && isPrep(L.steps[L.i]) && isPrep(L.steps[L.i + 1])) {
        L.records.push({ k: L.steps[L.i].k, g: null, start: 0, end: 0, timed: false }); L.i++; save(); return renderLive(true);
      }
      if (!L.startedAt) { L.records.push({ k: L.steps[L.i].k, g: null, start: 0, end: 0, timed: false }); L.startedAt = now; L.i++; L.stepStartMs = 0; L.status = "RUNNING"; save(); cue(); return renderLive(true); }
      beginStep(L, L.i + 1, clockMs(L, now)); save(); renderLive(true);
    }
    function togglePause() {
      var L = state.live, now = Date.now();
      if (!L.startedAt) return;
      if (L.status === "PAUSED") { L.pausedMs += now - L.pausedAt; L.pausedAt = null; L.status = L.prevStatus || "RUNNING"; }
      else { L.prevStatus = L.status; L.pausedAt = now; L.status = "PAUSED"; }
      save(); renderLive(true);
    }
    function finish() {
      var L = state.live, now = Date.now(), end = clockMs(L, now), r = recipeById(L.recipeId);
      L.records.push({ k: L.steps[L.i].k, g: L.steps[L.i].g || null, start: L.stepStartMs, end: end, timed: true });
      var id = "b" + now;
      state.brews.unshift({
        id: id, at: now, coffeeId: L.coffeeId, recipeId: L.recipeId, grinderId: L.grinderId, setting: L.setting, dose: L.dose,
        snap: snapshot(coffeeById(L.coffeeId), r, L.grinderId, L.setting, L.dose), seconds: Math.round(end / 1000),
        stepTimes: L.records.filter(function (x) { return x.timed; }).map(function (x) { return { k: x.k, g: x.g, start: Math.round(x.start / 1000), end: Math.round(x.end / 1000) }; }),
        tasting: null
      });
      state.live = null; state.tasteDraft = null; state.view = { type: "taste", id: id }; state.tab = "history";
      save(); closeLive(); render(); window.scrollTo(0, 0);
    }
    function abort() {
      if (!window.confirm(t("live.abortq"))) return;
      state.live = null; save(); closeLive(); render();
    }
    var audioCtx = null;
    function cue() {
      try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) { /* ignore */ }
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.06; o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.12);
      } catch (e) { /* audio unavailable */ }
    }

    function renderLive(force) {
      var L = state.live; if (!L) return;
      var now = Date.now(), ms = clockMs(L, now), s = L.steps[L.i], nx = L.steps[L.i + 1], last = !nx, r = recipeById(L.recipeId);
      var due = dueAtMs(L, L.i), started = !!L.startedAt;
      var progress = 0;
      if (due != null && started) { var span = due - L.stepStartMs; progress = span > 0 ? Math.min(1, (ms - L.stepStartMs) / span) : 1; }
      var key = [L.i, L.status, Math.floor(ms / 1000), S.lang].join("|");
      if (!force && key === lastRenderKey) { var bar = liveEl.querySelector(".bar b"); if (bar) bar.style.width = (progress * 100) + "%"; return; }
      lastRenderKey = key;
      var when = "";
      if (s.dur) when = t("live.for", { s: s.dur });
      else if (s.at && s.max) when = t("live.window", { a: mmss(s.at), b: mmss(s.max) });
      else if (s.at) when = t("live.until", { t: mmss(s.at) });
      var primary = last ? t("live.finish") : !started ? (isPrep(nx) ? t("live.confirm") : t("live.startTimer")) : L.status === "STEP_COMPLETE" ? t("live.nextbtn") : (due == null ? t("live.done") : t("live.nextbtn"));
      liveEl.innerHTML = '<div class="inner">' +
        '<div class="row between"><button class="back" type="button" id="l-abort">✕ ' + esc(t("live.abort")) + '</button><span class="muted" style="font-size:14px">' + esc(t(r.name)) + ' · ' + fmtG(L.dose) + ' g</span></div>' +
        '<div class="dots" aria-hidden="true">' + L.steps.map(function (_, i) { return '<span class="' + (i < L.i ? "done" : i === L.i ? "cur" : "") + '"></span>'; }).join("") + '</div>' +
        '<div class="timer' + (L.status === "PAUSED" ? " paused" : "") + '" role="timer" aria-live="off">' + mmss(ms / 1000) + '</div>' +
        '<div class="muted" style="text-align:center;font-weight:600">' + esc(started ? t("live.stepof", { n: L.i + 1, m: L.steps.length }) + (L.status === "PAUSED" ? " · " + t("live.paused") : "") : t("live.ready")) + '</div>' +
        '<div class="instr" id="live-instr" aria-live="polite">' + esc(stepText(s, L.dose)) + '</div>' +
        (s.g ? '<div class="target">' + esc(t("live.scale")) + ' <b>' + fmtG(s.g) + ' g</b>' + (when ? ' · ' + esc(when) : "") + '</div>' : when ? '<div class="target">' + esc(when) + '</div>' : "") +
        (due != null && started ? '<div class="bar"><b style="width:' + (progress * 100) + '%"></b></div>' : "") +
        (L.status === "STEP_COMPLETE" ? '<div class="due" role="status">' + esc(t("live.due")) + '</div>' : "") +
        '<div class="next">' + esc(nx ? t("live.next", { s: stepText(nx, L.dose) }) : t("live.last")) + '</div>' +
        '<div class="actions"><button class="btn" type="button" id="l-pause"' + (started ? "" : " disabled") + '>' + esc(L.status === "PAUSED" ? t("live.resume") : t("live.pause")) + '</button>' +
        '<button class="btn btn-primary" type="button" id="l-next"' + (L.status === "PAUSED" ? " disabled" : "") + '>' + esc(primary) + '</button></div>' +
      '</div>';
      document.getElementById("l-next").onclick = next;
      document.getElementById("l-pause").onclick = togglePause;
      document.getElementById("l-abort").onclick = abort;
    }

    // ---- Wiring --------------------------------------------------------------
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.onclick = function () { state.tab = b.getAttribute("data-tab"); state.view = null; save(); render(); window.scrollTo(0, 0); };
    });
    document.getElementById("reset").onclick = function () {
      closeLive(); state = seed(); save(); render(); toast(t("reset.done"));
    };
    S.onLang(function () { render(); if (state.live) renderLive(true); });
    document.addEventListener("keydown", function (e) {
      if (!state.live || liveEl.hidden) return;
      if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); next(); }
    });
    document.addEventListener("DOMContentLoaded", function () { if (state.live) openLive(); });
  })();
  </script>
</body>
</html>
